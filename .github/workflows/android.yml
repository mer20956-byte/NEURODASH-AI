name: Build NEURODASH AI (Android ARM64)
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Android ARM64 Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v5.11.2
          target: Android64
          build-config: Release
      - uses: actions/upload-artifact@v4
        with:
          name: NEURODASH-AI-Android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
